name: Build Craque Manager

# Roda a cada push e também manualmente (aba Actions > Run workflow).
on:
  push:
  workflow_dispatch:

# Cancela execuções antigas da mesma branch quando chega um push novo.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.5.1"
  GODOT_CHANNEL: "stable"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.1"

jobs:
  build:
    name: Testes + APK + Web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }} platforms;${{ env.ANDROID_PLATFORM }}"

      - name: Cache do Godot (binário + export templates)
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-linux

      - name: Instalar Godot e export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates
          cd "$RUNNER_TEMP"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot-bin
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}

      - name: Deixar o comando "godot" disponível
        run: |
          set -euo pipefail
          ln -sf ~/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Criar keystore de debug e configurar o editor para Android
        run: |
          set -euo pipefail
          KS="$HOME/debug.keystore"
          keytool -genkey -v -keystore "$KS" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          # O nome do arquivo de configurações varia entre versões; escrevemos os dois.
          for f in editor_settings-4.tres editor_settings-4.5.tres; do
            cat > ~/.config/godot/$f <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${KS}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES
          done
          # O Godot também lê estas variáveis para o keystore de debug.
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Importar o projeto (gera a pasta .godot)
        run: |
          # O --import às vezes sai com código ≠0 mesmo importando bem; o gate real são os testes abaixo.
          godot --headless --path . --import || true

      - name: Rodar a suíte de testes
        run: godot --headless --path . res://tests/run_tests.tscn

      - name: Exportar APK debug (Android)
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/craque-manager-debug.apk
          test -s build/android/craque-manager-debug.apk

      - name: Exportar Web (HTML5)
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html

      - name: Publicar artifact do APK
        uses: actions/upload-artifact@v4
        with:
          name: craque-manager-apk
          path: build/android/craque-manager-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artifact do Web
        uses: actions/upload-artifact@v4
        with:
          name: craque-manager-web
          path: build/web/
          if-no-files-found: error
          retention-days: 30

      - name: Preparar site para o GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy-pages:
    name: Publicar Web no GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Não deixa o workflow vermelho se o Pages ainda não foi ativado nas configurações do repositório.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
